name: GeoImpact KZ — collect and publish
on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - styles.css
      - impact_model.py
      - data/world.json
      - monitor.py
      - audit_30d.py
      - event_gate.py
      - atlas.py
      - investigate.py
      - export_atlas.py
      - data/curated_month.json
      - data/atlas_assets.psv
      - data/atlas_ownership.psv
      - data/atlas_links.psv
      - data/reviews.json
      - tests/**
      - .github/workflows/**
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: geoimpact-kz
  cancel-in-progress: false
jobs:
  monitor-and-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: https://aldiar523.github.io/geoimpact-kazakhstan/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify monitoring tests
        run: python -m unittest discover -s tests -v
      - name: Validate dashboard JavaScript
        run: node tests/check_dashboard.cjs
      - name: Poll 124 base and shock-first discovery feeds
        run: python monitor.py
      - name: Audit 30-day news coverage and map locations
        run: python audit_30d.py
      - name: Investigate matches and find primary-source leads
        run: python investigate.py
      - name: Build event-first relevance feed and audit rejected articles
        run: python event_gate.py
      - name: Export full research Atlas
        run: python export_atlas.py
      - name: Preserve candidate archive and health metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/geoimpact-monitor-data
          cp data/feed.json data/status.json data/investigations.json data/atlas.json data/review_audit.json data/events.json data/indicators.json data/event_gate_audit.json /tmp/geoimpact-monitor-data/
          success=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/geoimpact-monitor-data/* data/
            git add data/feed.json data/status.json data/investigations.json data/atlas.json data/review_audit.json data/events.json data/indicators.json data/event_gate_audit.json
            if git diff --cached --quiet; then success=1; break; fi
            git commit -m 'data: 12-hour GeoImpact source check [skip ci]'
            if git push origin HEAD:main; then success=1; break; fi
            sleep 2
          done
          test "$success" = 1
      - name: Assemble Pages artifact
        run: |
          mkdir -p site/data
          cp index.html app.js styles.css site/
          cp data/feed.json data/status.json data/investigations.json data/atlas.json data/world.json data/review_audit.json data/events.json data/indicators.json data/event_gate_audit.json site/data/
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
